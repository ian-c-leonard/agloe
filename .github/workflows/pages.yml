name: pages

# agloe.ai: the site in pages/. Publishes only from the main repository,
# and only after every check passes. The home page runs the reference checker in the
# reader's browser, so a change to the checker publishes the site again. The page of
# examples is written from the rules page, so a change to the rules or to an example
# publishes it again too.
on:
  push:
    branches: [main]
    paths:
      - pages/**
      - src/**
      - pyproject.toml
      - uv.lock
      - spec/rules.md
      - examples/**
      - tools/build_site_checker.py
      - tools/build_site_examples.py
      - tools/site_examples.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time. A publication that has started is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    # Forks do not publish agloe.ai.
    if: github.repository == 'ian-c-leonard/agloe'
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      # Puts the reference checker in pages/vendor/, where the page loads it from.
      - run: uv run --no-project python tools/build_site_checker.py
      # Writes pages/examples/index.html from the examples section of the rules page.
      - run: uv run --no-project python tools/build_site_examples.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

  # Only this job may publish to Pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
