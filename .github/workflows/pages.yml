name: pages

# agloe.ai: the home page in pages/. Publishes only from the main repository,
# and only after every check passes.
on:
  push:
    branches: [main]
    paths:
      - pages/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time. A publication that has started is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    # Forks do not publish agloe.ai.
    if: github.repository == 'ian-c-leonard/agloe'
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

  # Only this job may publish to Pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
